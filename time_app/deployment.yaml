# Author: Qikai Yang - DCN Lab 2
# Equivalent to: kubectl create deployment + kubectl expose --type=NodePort --port 8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-time-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-time-app
  template:
    metadata:
      labels:
        app: sample-time-app
    spec:
      containers:
        - name: sample-time-app
          image: docker.io/marquese0318/sample-time-app:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sample-time-app
spec:
  type: NodePort
  selector:
    app: sample-time-app
  ports:
    - port: 8080
      targetPort: 8080
