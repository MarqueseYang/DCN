# Qikai Yang (qy1166) - DCN Lab 3 - Extra credit
# Deploy with:  kubectl apply -f deploy_dns.yml
# Replace YOUR_DOCKERHUB_USER with your Docker Hub username before applying.
# NodePorts: AS=30001 (UDP), FS=30002, US=30003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: as-deployment
  labels: {app: as}
spec:
  replicas: 1
  selector:
    matchLabels: {app: as}
  template:
    metadata:
      labels: {app: as}
    spec:
      containers:
        - name: as
          image: YOUR_DOCKERHUB_USER/dns-as:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 53533
              protocol: UDP
          volumeMounts:
            - name: as-data
              mountPath: /app/data
      volumes:
        - name: as-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: as-service
spec:
  type: NodePort
  selector: {app: as}
  ports:
    - name: dns
      protocol: UDP
      port: 53533
      targetPort: 53533
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fs-deployment
  labels: {app: fs}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fs}
  template:
    metadata:
      labels: {app: fs}
    spec:
      containers:
        - name: fs
          image: YOUR_DOCKERHUB_USER/dns-fs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: fs-service
spec:
  type: NodePort
  selector: {app: fs}
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: us-deployment
  labels: {app: us}
spec:
  replicas: 1
  selector:
    matchLabels: {app: us}
  template:
    metadata:
      labels: {app: us}
    spec:
      containers:
        - name: us
          image: YOUR_DOCKERHUB_USER/dns-us:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: us-service
spec:
  type: NodePort
  selector: {app: us}
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30003
